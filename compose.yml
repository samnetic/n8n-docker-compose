# =============================================================================
# n8n Production-Ready Docker Compose (Security Hardened)
# =============================================================================
# Single compose file for staging AND production deployments.
# Use environment variables to control behavior.
#
# Quick Start:
#   ./n8n init local     # Generate secrets + .env.local
#   ./n8n local up -d    # Start with defaults
#   ./n8n local logs -f  # Follow logs
#   ./n8n local down     # Stop all
#
# Scale workers:
#   ./n8n local up -d --scale n8n-worker=3
#
# Architecture:
#   n8n-main ─────► Task Broker :5679 ◄──── n8n-main-runner (sidecar)
#       │
#       ▼ Redis Queue
#       │
#   n8n-worker ──► Task Broker :5679 ◄──── n8n-worker-runner (sidecar)
#
# Security:
#   - Secrets mounted as files via Docker secrets (not env vars)
#   - Network segmentation: frontend (internet) / backend (internal only)
#   - Read-only filesystems with tmpfs for writable paths
#   - Capabilities dropped, no-new-privileges enforced
#   - Localhost-only port binding
# =============================================================================

# -----------------------------------------------------------------------------
# Docker Secrets (file-based, generated by `./n8n init`)
# -----------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password
  n8n_encryption_key:
    file: ${SECRETS_DIR:-./secrets}/n8n_encryption_key
  n8n_runners_auth_token:
    file: ${SECRETS_DIR:-./secrets}/n8n_runners_auth_token

# -----------------------------------------------------------------------------
# Shared Anchors (DRY)
# -----------------------------------------------------------------------------
x-n8n-image: &n8n-image
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.0.3}

x-runner-image: &runner-image
  # To use custom runner with extra packages, uncomment below and comment out the image line
  # build:
  #   context: .
  #   dockerfile: docker/Dockerfile.runners
  #   args:
  #     RUNNERS_VERSION: ${RUNNERS_VERSION:-latest}
  # image: n8n-runners-custom:${N8N_VERSION:-2.0.3}
  image: n8nio/runners:${RUNNERS_VERSION:-latest}

x-common: &common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      tag: "{{.Name}}"

x-security: &security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-n8n-env: &n8n-env
  GENERIC_TIMEZONE: ${TZ:-UTC}
  NODE_ENV: production
  # Database
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
  # Encryption (same across all instances!)
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  # Queue mode
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD_FILE: /run/secrets/redis_password
  # Task runners
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
  # Security
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
  N8N_SAMESITE_COOKIE: strict
  N8N_RESTRICT_FILE_ACCESS_TO: "/home/node/.n8n"
  N8N_COMMUNITY_PACKAGES_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PUBLIC_API_DISABLED: "true"
  N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
  N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]'
  # Execution data
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
  # Code node modules (fs intentionally excluded)
  NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto,path,url,util}
  NODE_FUNCTION_ALLOW_EXTERNAL: ${NODE_FUNCTION_ALLOW_EXTERNAL:-lodash,moment,axios}
  # Logging
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
  N8N_HIRING_BANNER_ENABLED: "false"
  # Isolation: disable all outbound connections to n8n servers
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
  N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
  EXTERNAL_FRONTEND_HOOKS_URLS: ""
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"

x-runner-env: &runner-env
  # Security
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
  N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}
  N8N_RUNNERS_TASK_BROKER_URI: http://localhost:5679
  N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-60}
  N8N_RUNNERS_INSECURE_MODE: "false"
  NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto,path,url,util}
  NODE_FUNCTION_ALLOW_EXTERNAL: ${NODE_FUNCTION_ALLOW_EXTERNAL:-lodash,moment,axios}
  # Python runner security
  N8N_BLOCK_RUNNER_ENV_ACCESS: "true"

x-healthcheck-n8n: &healthcheck-n8n
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
    start_interval: 5s

x-healthcheck-runner: &healthcheck-runner
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:5680/healthz || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
    start_interval: 5s

x-deploy-n8n: &deploy-n8n
  deploy:
    resources:
      limits:
        memory: ${N8N_MEMORY_LIMIT:-2G}
        cpus: "${N8N_CPU_LIMIT:-2.0}"
        pids: 256
      reservations:
        memory: 512M

x-deploy-runner: &deploy-runner
  deploy:
    resources:
      limits:
        memory: ${RUNNER_MEMORY_LIMIT:-1G}
        cpus: "${RUNNER_CPU_LIMIT:-1.0}"
        pids: 256
      reservations:
        memory: 256M

x-deploy-postgres: &deploy-postgres
  deploy:
    resources:
      limits:
        memory: ${POSTGRES_MEMORY_LIMIT:-512M}
        pids: 256
      reservations:
        memory: 128M

x-deploy-redis: &deploy-redis
  deploy:
    resources:
      limits:
        memory: ${REDIS_MEMORY_LIMIT:-256M}
        pids: 128
      reservations:
        memory: 64M

# -----------------------------------------------------------------------------
# Infrastructure
# -----------------------------------------------------------------------------
volumes:
  n8n_data:
  postgres_data:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    <<: [*common, *security, *deploy-postgres]
    networks: [backend]
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /run/postgresql:noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 3s

  # --- Redis ---
  redis:
    image: redis:7-alpine
    <<: [*common, *security, *deploy-redis]
    networks: [backend]
    cap_add:
      - SETGID
      - SETUID
    secrets:
      - redis_password
    command: >-
      sh -c 'redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy volatile-lru
      --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 3s

  # --- n8n Main (Editor/API/Webhooks) ---
  n8n-main:
    <<: [*n8n-image, *common, *security, *healthcheck-n8n, *deploy-n8n]
    networks: [frontend, backend]
    depends_on:
      postgres: { condition: service_healthy, restart: true }
      redis: { condition: service_healthy, restart: true }
    secrets:
      - postgres_password
      - redis_password
      - n8n_encryption_key
      - n8n_runners_auth_token
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_METRICS: "true"
      EXECUTIONS_TIMEOUT: ${EXECUTIONS_TIMEOUT:-3600}
    volumes:
      - n8n_data:/home/node/.n8n
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /home/node/.cache:noexec,nosuid,size=64m

  # --- Task Runner for Main ---
  n8n-main-runner:
    <<: [*runner-image, *common, *security, *healthcheck-runner, *deploy-runner]
    user: "65532:65532"
    network_mode: "service:n8n-main"
    depends_on:
      n8n-main: { condition: service_healthy, restart: true }
    secrets:
      - n8n_runners_auth_token
    environment:
      <<: *runner-env
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /home/runner/.cache:noexec,nosuid,size=64m

  # --- n8n Worker (scalable) ---
  n8n-worker:
    <<: [*n8n-image, *common, *security, *healthcheck-n8n, *deploy-n8n]
    command: worker --concurrency=${WORKER_CONCURRENCY:-10}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy, restart: true }
      redis: { condition: service_healthy, restart: true }
      n8n-main: { condition: service_healthy, restart: true }
    secrets:
      - postgres_password
      - redis_password
      - n8n_encryption_key
      - n8n_runners_auth_token
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      EXECUTIONS_TIMEOUT: ${EXECUTIONS_TIMEOUT:-3600}
    volumes:
      - n8n_data:/home/node/.n8n
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /home/node/.cache:noexec,nosuid,size=64m

  # --- Task Runner for Worker ---
  n8n-worker-runner:
    <<: [*runner-image, *common, *security, *healthcheck-runner, *deploy-runner]
    user: "65532:65532"
    network_mode: "service:n8n-worker"
    depends_on:
      n8n-worker: { condition: service_healthy, restart: true }
    secrets:
      - n8n_runners_auth_token
    environment:
      <<: *runner-env
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /home/runner/.cache:noexec,nosuid,size=64m
